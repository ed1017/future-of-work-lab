name: Retest scores

# Re-scores the first 50 validation-sample tasks (scripts/retest.mjs) for the test-retest check.
# Start it from the Actions tab (Run workflow), or add the "run-retest" label to a
# pull request to run it from that branch before it merges.
#
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, OPENAI_API_KEY
# Variables: OPENAI_MODEL, OPENAI_PRICE_INPUT_PER_1M, OPENAI_PRICE_OUTPUT_PER_1M

on:
  workflow_dispatch:
    inputs:
      again:
        description: Repeat the retest even if one already exists
        type: boolean
        default: false
      dry_run:
        description: Read the sample only; no model calls
        type: boolean
        default: false
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: retest-scores
  cancel-in-progress: false

jobs:
  retest:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-retest'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_PRICE_INPUT_PER_1M: ${{ vars.OPENAI_PRICE_INPUT_PER_1M }}
      OPENAI_PRICE_OUTPUT_PER_1M: ${{ vars.OPENAI_PRICE_OUTPUT_PER_1M }}
      AGAIN: ${{ inputs.again && '--again' || '' }}
      DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run retest -- $AGAIN $DRY_RUN
